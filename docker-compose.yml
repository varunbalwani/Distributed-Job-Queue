version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    volumes:
      - ./jobs.db:/jobs.db
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      - api
    volumes:
      - ./jobs.db:/jobs.db
